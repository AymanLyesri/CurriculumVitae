name: Build and Publish CVs

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Stars
        run: |
          STARS=$(curl -s https://api.github.com/repos/AymanLyesri/ArchEclipse | jq '.stargazers_count')

          if [ -z "$STARS" ] || [ "$STARS" = "null" ]; then
            STARS="500"
          fi

          echo "\renewcommand{\archEclipseStars}{$STARS}" > stars.tex

      - name: Compile English Version
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV-AYMAN-LYESRI.tex

      - name: Save English PDF
        run: mv CV-AYMAN-LYESRI.pdf CV-Ayman-Lyesri-English.pdf

      - name: Switch Language Toggle to French
        run: |
          sed -i 's/\\setboolean{isEnglish}{true}/\\setboolean{isEnglish}{false}/' CV-AYMAN-LYESRI.tex

      - name: Compile French Version
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV-AYMAN-LYESRI.tex

      - name: Save French PDF
        run: mv CV-AYMAN-LYESRI.pdf CV-Ayman-Lyesri-French.pdf

      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true

      - name: Delete existing tag (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin :refs/tags/latest || true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            CV-Ayman-Lyesri-English.pdf \
            CV-Ayman-Lyesri-French.pdf \
            --title "Latest CV" \
            --notes "Automatically generated from the latest commit."
